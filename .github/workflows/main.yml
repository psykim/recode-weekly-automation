name: RECODE WEEKLY 자동 생성

on:
  schedule:
    # 매주 금요일 새벽 0시 (KST = UTC+9이므로 목요일 15:00 UTC)
    - cron: '0 15 * * 4'
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v5
      
    - name: Python 설정
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        
    - name: 종속성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 보고서 생성
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}   # 선택 — 없으면 키 없이 조회
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # 에디터 노트 — 없으면 틀 문장
      run: |
        cd scripts
        python generate_report.py
        
    - name: reports.json 업데이트
      run: |
        cd scripts
        python update_dashboard_reports.py
        
    - name: Git 설정
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
    - name: 변경사항 커밋 및 푸시
      run: |
        git add reports/*.html web/reports.json
        git diff --staged --quiet || (git commit -m "새로운 RECODE WEEKLY 보고서 생성 - $(date +'%Y-%m-%d')" && git push)
        
    - name: 이메일 발송
      env:
        SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_NAME: ${{ secrets.SENDER_NAME }}
        RECIPIENTS_JSON: ${{ secrets.RECIPIENTS_JSON }}     # 비공개 수신자 명단 — 없으면 database/recipients.json
      run: |
        cd scripts
        python send_email.py
        
    - name: 완료 메시지
      run: |
        echo "✅ RECODE WEEKLY 보고서가 성공적으로 생성되었습니다!"
        echo "📧 이메일 발송까지 성공했습니다(실패하면 앞 단계에서 멈춥니다)."
        echo "📊 보고서 확인: https://psykim.github.io/recode-weekly-automation/"
